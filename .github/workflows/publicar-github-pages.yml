name: Publicar AgroCiencia Del Norte en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar archivos e integración
        run: python tests/verificar_integracion.py
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
